[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steam_auth", "src/steam_scraper"]

[project]
name = "steam-scraper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "curl-cffi>=0.15.0",
    "python-dotenv>=1.2.2",
    "rsa>=4.9.1",
    "scrapy>=2.17.0",
]

[project.scripts]
steam-auth = "steam_auth.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.15.21",
]

[tool.ruff]
extend-exclude = ['migrations']
line-length = 120

[tool.ruff.format]
preview = true
quote-style = 'single'
